#Compressed Blocks configuration
#Changes require a game restart to take effect.
#WARNING: These settings are loaded on startup and not synced with the server.
#Ensure identical configuration on both client and server to prevent connection issues.
#Any changes will log warnings for invalid or missing files.
#----------------------------------------
#Enable compressed blocks
blocksEnabled = true
#Enable crates
cratesEnabled = true
#Maximum compression level for all blocks
# Default: 10
# Range: 1 ~ 10
maxCompressionLevel = 10
#Maximum compression level for all crates
# Default: 10
# Range: 1 ~ 10
maxCrateCompressionLevel = 10
#Hardness levels for each compression level
hardnessLevels = [5.0, 6.5, 8.5, 12.5, 15.0, 20.5, 25.5, 30.5, 40.0, 50.0]
#Resistance levels for each compression level
resistanceLevels = [35.5, 75.0, 150.0, 300.0, 600.0, 800.0, 1250.0, 2000.0, 5000.0, 7500.0]

